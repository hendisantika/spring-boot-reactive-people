# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # ☕ Maven dependencies & plugins (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    assignees:
      - "hendisantika"
    commit-message:
      # "include: scope" appends (deps) / (deps-dev) -> build(deps): ... / build(deps-dev): ...
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      spring-framework:
        patterns:
          - "org.springframework:*"
          - "org.springframework.restdocs:*"
          - "org.springframework.data:*"
      springdoc:
        patterns:
          - "org.springdoc:*"
      testcontainers:
        patterns:
          - "org.testcontainers:*"
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "io.github.git-commit-id:*"
          - "org.asciidoctor:*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # 🤖 GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github_actions"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # 🐳 Docker base image (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "build(docker)"
    ignore:
      # stay on the JDK 25 (LTS) line
      - dependency-name: "eclipse-temurin"
        update-types: [ "version-update:semver-major" ]

  # 🐘 Docker Compose services (docker-compose.yml)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Asia/Jakarta"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "hendisantika"
    commit-message:
      prefix: "build(docker)"
